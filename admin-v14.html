<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bali ScamCheck — Admin V14</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7f6;margin:0;color:#10201b}
.wrap{max-width:900px;margin:auto;padding:18px}
.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 15px #0001}
h1{margin:0 0 4px;font-size:22px}.muted{color:#667}.hidden{display:none}
input,select,textarea,button{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd7d3;border-radius:10px;margin:6px 0;font-size:15px}
button{background:#123d2d;color:white;border:0;font-weight:700;cursor:pointer}.danger{background:#a22}.secondary{background:#667}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center;background:#f0f5f3;padding:12px;border-radius:12px}
.report{border:1px solid #dde6e2;border-radius:12px;padding:13px;margin:9px 0}.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#eef2f0;font-size:12px;font-weight:bold}
.err{color:#a00;background:#fff0f0;padding:10px;border-radius:10px;margin-top:8px}.ok{color:#075b39;background:#effaf5;padding:10px;border-radius:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>🛡️ BALI SCAMCHECK</h1>
<div class="muted">Admin Command Center • V14 STABLE</div>
</div>

<div id="loginBox" class="card">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Email admin" autocomplete="username">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button onclick="loginAdmin()">LOGIN</button>
<div id="loginMsg"></div>
</div>

<div id="app" class="hidden">
<div class="card">
<div class="grid">
<div class="stat"><b id="pending">0</b><br>Pending</div>
<div class="stat"><b id="verified">0</b><br>Verified</div>
<div class="stat"><b id="rejected">0</b><br>Rejected</div>
<div class="stat"><b id="alerts">0</b><br>Alert</div>
</div>
</div>

<div class="card">
<div class="row">
<input id="search" placeholder="Cari target, cerita, alert..." oninput="render()">
<select id="filter" onchange="render()">
<option value="all">Semua</option><option value="pending">Pending</option>
<option value="verified">Verified</option><option value="rejected">Rejected</option><option value="alert">Alert</option>
</select>
</div>
<button class="secondary" onclick="loadReports()">↻ REFRESH</button>
<button class="danger" onclick="logout()">LOGOUT</button>
</div>

<div id="reports"></div>
</div>
</div>

<script>
const SUPABASE_URL="https://mqfipqpmsuapfctotjzo.supabase.co";
const SUPABASE_KEY="sb_publishable_4sFZXYku2HwgJ7wvHWwKLA_tN-nKxk-";
let token=sessionStorage.getItem("bsc_v14_token")||"";
let reports=[];

function msg(text,type="err"){const el=document.getElementById("loginMsg");el.className=type;el.textContent=text}
function headers(auth=true){
 const h={"apikey":SUPABASE_KEY,"Content-Type":"application/json"};
 if(auth) h["Authorization"]="Bearer "+token;
 return h;
}
async function request(path,opt={}){
 const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),15000);
 try{
  const res=await fetch(SUPABASE_URL+path,{cache:"no-store",...opt,headers:{...headers(opt.auth!==false),...(opt.headers||{})},signal:controller.signal});
  const text=await res.text(); let data; try{data=text?JSON.parse(text):null}catch{data=text}
  if(!res.ok) throw new Error((data&&data.msg)||(data&&data.message)||text||("HTTP "+res.status));
  return data;
 }finally{clearTimeout(timer)}
}
async function loginAdmin(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password){msg("Isi email dan password.");return}
 msg("Menghubungkan ke Supabase...","ok");
 try{
  const data=await request("/auth/v1/token?grant_type=password",{
   method:"POST",auth:false,body:JSON.stringify({email,password})
  });
  if(!data.access_token) throw new Error("Token login tidak diterima.");
  token=data.access_token; sessionStorage.setItem("bsc_v14_token",token);
  const user=await request("/auth/v1/user");
  if(user.app_metadata?.role!=="admin"){
   token="";sessionStorage.removeItem("bsc_v14_token");
   throw new Error("Login berhasil, tetapi akun ini bukan admin. Set app_metadata.role = admin di Supabase.");
  }
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  await loadReports();
 }catch(e){
  msg("GAGAL: "+(e.name==="AbortError"?"Request timeout.":e.message));
 }
}
async function loadReports(){
 try{
  reports=await request("/rest/v1/reports?select=*&order=created_at.desc");
  updateStats();render();
 }catch(e){
  if(String(e.message).toLowerCase().includes("jwt")||String(e.message).toLowerCase().includes("token")) logout();
  else alert("Gagal memuat laporan: "+e.message);
 }
}
function updateStats(){
 document.getElementById("pending").textContent=reports.filter(x=>x.status==="pending").length;
 document.getElementById("verified").textContent=reports.filter(x=>x.status==="verified").length;
 document.getElementById("rejected").textContent=reports.filter(x=>x.status==="rejected").length;
 document.getElementById("alerts").textContent=reports.filter(x=>x.is_alert===true).length;
}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const f=document.getElementById("filter").value;
 const arr=reports.filter(r=>{
  const text=[r.target,r.story,r.alert_title,r.admin_note,r.category,r.area].join(" ").toLowerCase();
  return (!q||text.includes(q))&&(f==="all"||(f==="alert"?r.is_alert===true:r.status===f));
 });
 document.getElementById("reports").innerHTML=arr.map(r=>`
 <div class="card report">
  <div><span class="badge">${esc(r.status)}</span> ${r.is_alert?"🚨 ALERT":""}</div>
  <h3>${esc(r.target)}</h3>
  <div class="muted">${esc(r.target_type)} • ${esc(r.category)} • ${esc(r.area)}</div>
  <p>${esc(r.story)}</p>
  ${r.alert_title?`<p><b>Alert:</b> ${esc(r.alert_title)}</p>`:""}
  ${r.admin_note?`<p><b>Catatan admin:</b> ${esc(r.admin_note)}</p>`:""}
  <div class="row">
   ${r.status==="pending"?`<button onclick="setStatus(${r.id},'verified')">✓ VERIFY</button><button class="danger" onclick="setStatus(${r.id},'rejected')">✕ REJECT</button>`:""}
   ${r.status==="verified"&&!r.is_alert?`<button onclick="makeAlert(${r.id})">🚨 JADIKAN ALERT</button>`:""}
   ${r.is_alert?`<button class="danger" onclick="deactivateAlert(${r.id})">NONAKTIFKAN ALERT</button>`:""}
  </div>
 </div>`).join("")||'<div class="card">Tidak ada laporan.</div>';
}
async function setStatus(id,status){
 try{await request("/rest/v1/reports?id=eq."+id,{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({status})});await loadReports()}catch(e){alert(e.message)}
}
async function makeAlert(id){
 const title=prompt("Judul alert:");
 if(!title||!title.trim())return;
 try{await request("/rest/v1/reports?id=eq."+id,{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({is_alert:true,alert_title:title.trim(),status:"verified"})});await loadReports()}catch(e){alert(e.message)}
}
async function deactivateAlert(id){
 if(!confirm("Nonaktifkan alert ini?"))return;
 try{await request("/rest/v1/reports?id=eq."+id,{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({is_alert:false})});await loadReports()}catch(e){alert(e.message)}
}
function logout(){token="";sessionStorage.removeItem("bsc_v14_token");location.reload()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function restore(){
 if(!token)return;
 try{
  const u=await request("/auth/v1/user");
  if(u.app_metadata?.role==="admin"){
   document.getElementById("loginBox").classList.add("hidden");
   document.getElementById("app").classList.remove("hidden");
   await loadReports();
  }else logout();
 }catch{sessionStorage.removeItem("bsc_v14_token");token=""}
}
restore();
</script>
</body>
</html>
