<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bali ScamCheck — Admin V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#071311;color:#edf7f3}
.wrap{max-width:760px;margin:auto;padding:18px}.brand{font-size:24px;font-weight:800}.sub,.muted{color:#9bb0aa}.sub{margin:3px 0 18px}
.card{background:#10201d;border:1px solid #28403a;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 10px 28px #0003}
input,textarea,button{width:100%;padding:12px 13px;border-radius:11px;border:1px solid #36514a;background:#0b1816;color:#fff;font-size:15px;margin-top:8px}textarea{min-height:82px;resize:vertical}
button{cursor:pointer;font-weight:800}.primary{background:#dff7ec;color:#0a1714;border:0}.danger{background:#401b1b}.ghost{background:transparent}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logout{width:auto;margin:0;padding:9px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0b1816;border:1px solid #28403a;border-radius:14px;padding:12px}.num{font-size:23px;font-weight:800}.label{font-size:12px;color:#9bb0aa}
.filters{display:grid;grid-template-columns:1fr auto;gap:8px}.refresh{width:auto;margin:0;padding:11px 15px}
.report{border-top:1px solid #28403a;padding:16px 0}.report:first-child{border-top:0}.target{font-size:18px;font-weight:800;word-break:break-word}.meta{font-size:12px;color:#9bb0aa;line-height:1.5;margin:5px 0 10px}.story{white-space:pre-wrap;line-height:1.45;color:#d9e7e3}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#332c10;color:#f2dc83}.badge.v{background:#123b2b;color:#9ee2bd}.badge.r{background:#401c1c;color:#ffaaaa}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.note{margin-top:10px}.hidden{display:none!important}
@media(max-width:430px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">BALI SCAMCHECK 🔐</div><div class="sub">Admin Verification V2</div>

<section id="login" class="card">
<h2>Login Admin</h2><div class="muted">Gunakan akun admin Supabase.</div>
<input id="email" type="email" placeholder="Email admin">
<input id="password" type="password" placeholder="Password">
<button class="primary" onclick="login()">LOGIN</button><p id="loginMsg" class="muted"></p>
</section>

<section id="app" class="hidden">
<div class="top"><div><h2 style="margin:0">Dashboard</h2><div id="who" class="muted"></div></div><button class="logout ghost" onclick="logout()">Logout</button></div>

<div class="stats" style="margin-top:12px">
<div class="stat"><div class="num" id="pendingN">0</div><div class="label">Pending</div></div>
<div class="stat"><div class="num" id="verifiedN">0</div><div class="label">Verified</div></div>
<div class="stat"><div class="num" id="rejectedN">0</div><div class="label">Rejected</div></div>
</div>

<div class="card">
<div class="filters"><input id="search" placeholder="Cari nomor/rekening..." oninput="render()"><button class="refresh primary" onclick="loadAll()">↻</button></div>
</div>

<div id="list" class="card"><div class="muted">Memuat...</div></div>
</section>
</div>

<script>
const SUPABASE_URL="https://mqfipqpmsuapfctotjzo.supabase.co";
const SUPABASE_KEY="sb_publishable_4sFZXYku2HwgJ7wvHWwKLA_tN-nKxk-";
let accessToken="", rows=[];

async function auth(path,body){
 const r=await fetch(SUPABASE_URL+"/auth/v1/"+path,{method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
 const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}
 if(!r.ok)throw new Error(d.error_description||d.msg||t||"Login gagal");return d;
}
async function login(){
 loginMsg.textContent="Memproses...";
 try{
  const d=await auth("token?grant_type=password",{email:email.value.trim(),password:password.value});
  accessToken=d.access_token;sessionStorage.setItem("bsc_admin_token",accessToken);
  showApp(email.value.trim());await loadAll();
 }catch(e){loginMsg.textContent=e.message}
}
function showApp(w){document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");who.textContent=w||"Admin"}
async function api(path,opt={}){
 const headers={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+accessToken,"Content-Type":"application/json",...(opt.headers||{})};
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opt,headers});
 const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{}
 if(!r.ok)throw new Error((d&&d.message)||t||("HTTP "+r.status));return d;
}
async function loadAll(){
 list.innerHTML="<div class='muted'>Memuat laporan...</div>";
 try{
  rows=await api("reports?select=*&order=created_at.desc");
  pendingN.textContent=rows.filter(x=>x.status==="pending").length;
  verifiedN.textContent=rows.filter(x=>x.status==="verified").length;
  rejectedN.textContent=rows.filter(x=>x.status==="rejected").length;
  render();
 }catch(e){list.innerHTML="<div class='muted'>Gagal memuat: "+esc(e.message)+"</div>"}
}
function render(){
 const q=search.value.trim().toLowerCase();
 const data=rows.filter(r=>!q||String(r.target).toLowerCase().includes(q)||String(r.story).toLowerCase().includes(q));
 if(!data.length){list.innerHTML="<div class='muted'>Tidak ada laporan.</div>";return}
 list.innerHTML=data.map(r=>{
  const pending=r.status==="pending";
  return `<div class="report">
   <div class="target">${esc(r.target)}</div>
   <div class="meta">${esc(r.target_type)} • ${esc(r.category)} • ${esc(r.area)}<br>${new Date(r.created_at).toLocaleString("id-ID")} <span class="badge ${r.status==="verified"?"v":r.status==="rejected"?"r":""}">${esc(r.status)}</span></div>
   <div class="story">${esc(r.story)}</div>
   ${r.admin_note?`<div class="note muted"><b>Catatan admin:</b> ${esc(r.admin_note)}</div>`:""}
   ${pending?`<div class="note"><textarea id="note_${r.id}" placeholder="Catatan admin / alasan keputusan (opsional)"></textarea>
   <div class="actions"><button class="primary" onclick="setStatus(${r.id},'verified')">✓ VERIFIKASI</button><button class="danger" onclick="setStatus(${r.id},'rejected')">✕ TOLAK</button></div></div>`:""}
  </div>`}).join("");
}
async function setStatus(id,status){
 const note=(document.getElementById("note_"+id)?.value||"").trim();
 const word=status==="verified"?"verifikasi":"menolak";
 if(!confirm("Yakin ingin "+word+" laporan #"+id+"?"))return;
 try{
  await api("reports?id=eq."+id,{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({status,admin_note:note||null})});
  await loadAll();
 }catch(e){alert("Gagal mengubah status:\n"+e.message)}
}
function logout(){accessToken="";sessionStorage.removeItem("bsc_admin_token");location.reload()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function restore(){
 const t=sessionStorage.getItem("bsc_admin_token");if(!t)return;accessToken=t;
 try{const r=await fetch(SUPABASE_URL+"/auth/v1/user",{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+t}});if(!r.ok)throw 0;const u=await r.json();showApp(u.email||"Admin");await loadAll()}catch{sessionStorage.removeItem("bsc_admin_token")}
}
restore();
</script>
</body>
</html>
