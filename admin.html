<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bali ScamCheck — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#071311;color:#edf7f3}
.wrap{max-width:720px;margin:auto;padding:20px}.brand{font-size:24px;font-weight:800;letter-spacing:.5px}.sub{color:#9bb0aa;margin:4px 0 22px}
.card{background:#10201d;border:1px solid #28403a;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 10px 30px #0003}
input,button,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #36514a;background:#0b1816;color:#fff;font-size:15px;margin-top:9px}
button{cursor:pointer;font-weight:700}.primary{background:#dff7ec;color:#0a1714;border:0}.danger{background:#3a1717}.muted{color:#9bb0aa;font-size:13px}
.report{border-top:1px solid #28403a;padding:15px 0}.report:first-child{border-top:0}.target{font-weight:800;font-size:17px}.meta{color:#9bb0aa;font-size:13px;margin:5px 0 9px}.story{line-height:1.45;color:#d7e5e1}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
#app{display:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.logout{width:auto;padding:9px 12px;margin:0;background:transparent}
.status{padding:6px 9px;border-radius:999px;background:#332c10;color:#f2dc83;font-size:12px;font-weight:700}
.ok{background:#123b2b;color:#9ee2bd}.no{background:#401c1c;color:#ffaaaa}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">BALI SCAMCHECK 🔐</div>
  <div class="sub">Admin Verification</div>

  <section id="login" class="card">
    <h2>Login Admin</h2>
    <div class="muted">Gunakan akun admin Supabase yang sudah dibuat.</div>
    <input id="email" type="email" placeholder="Email admin">
    <input id="password" type="password" placeholder="Password">
    <button class="primary" onclick="login()">LOGIN</button>
    <p id="loginMsg" class="muted"></p>
  </section>

  <section id="app">
    <div class="top">
      <div>
        <h2 style="margin-bottom:3px">Laporan Pending</h2>
        <div id="who" class="muted"></div>
      </div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
    <button class="primary" onclick="loadReports()">↻ REFRESH</button>
    <div id="list" class="card"><div class="muted">Memuat...</div></div>
  </section>
</div>

<script>
const SUPABASE_URL="https://mqfipqpmsuapfctotjzo.supabase.co";
const SUPABASE_KEY="sb_publishable_4sFZXYku2HwgJ7wvHWwKLA_tN-nKxk-";
let accessToken="";

async function auth(path, body){
  const r=await fetch(SUPABASE_URL+"/auth/v1/"+path,{
    method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  const t=await r.text(); let d={}; try{d=JSON.parse(t)}catch{}
  if(!r.ok) throw new Error(d.error_description||d.msg||t||"Login gagal");
  return d;
}
async function login(){
  const msg=document.getElementById("loginMsg");
  msg.textContent="Memproses...";
  try{
    const d=await auth("token?grant_type=password",{email:email.value.trim(),password:password.value});
    accessToken=d.access_token;
    sessionStorage.setItem("bsc_admin_token",accessToken);
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("who").textContent=email.value.trim();
    await loadReports();
  }catch(e){msg.textContent=e.message}
}
async function api(path,opt={}){
  const headers={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+accessToken,"Content-Type":"application/json",...(opt.headers||{})};
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opt,headers});
  const t=await r.text(); let d=null; try{d=t?JSON.parse(t):null}catch{}
  if(!r.ok) throw new Error((d&&d.message)||t||("HTTP "+r.status));
  return d;
}
async function loadReports(){
  const box=document.getElementById("list");
  box.innerHTML="<div class='muted'>Memuat laporan...</div>";
  try{
    const rows=await api("reports?select=*&status=eq.pending&order=created_at.desc");
    if(!rows.length){box.innerHTML="<div class='muted'>Tidak ada laporan pending 🎉</div>";return}
    box.innerHTML=rows.map(r=>`
      <div class="report">
        <div class="target">${esc(r.target)}</div>
        <div class="meta">${esc(r.target_type)} • ${esc(r.category)} • ${esc(r.area)} • ${new Date(r.created_at).toLocaleString("id-ID")}</div>
        <div class="story">${esc(r.story)}</div>
        <div class="actions">
          <button class="primary" onclick="setStatus(${r.id},'verified')">✓ VERIFIKASI</button>
          <button class="danger" onclick="setStatus(${r.id},'rejected')">✕ TOLAK</button>
        </div>
      </div>`).join("");
  }catch(e){
    box.innerHTML="<div class='muted'>Gagal memuat: "+esc(e.message)+"</div>";
  }
}
async function setStatus(id,status){
  const label=status==="verified"?"verifikasi":"menolak";
  if(!confirm("Yakin ingin "+label+" laporan #"+id+"?"))return;
  try{
    await api("reports?id=eq."+id,{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({status})});
    await loadReports();
  }catch(e){alert("Gagal mengubah status: "+e.message)}
}
function logout(){accessToken="";sessionStorage.removeItem("bsc_admin_token");location.reload()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function restore(){
  const t=sessionStorage.getItem("bsc_admin_token"); if(!t)return;
  accessToken=t;
  try{
    const r=await fetch(SUPABASE_URL+"/auth/v1/user",{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+t}});
    if(!r.ok)throw 0;
    const u=await r.json();
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("who").textContent=u.email||"Admin";
    await loadReports();
  }catch{sessionStorage.removeItem("bsc_admin_token")}
}
restore();
</script>
</body>
</html>
