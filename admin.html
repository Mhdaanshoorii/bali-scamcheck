<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071311"><title>Bali ScamCheck — Admin V5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06110f;color:#edf7f3;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.brand{font-size:25px;font-weight:900;letter-spacing:.3px}.sub,.muted{color:#91aaa2}.sub{margin:4px 0 18px}.card{background:#0d1d19;border:1px solid #29423b;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 14px 35px #0004}h2{margin:0 0 12px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top button{width:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#081612;border:1px solid #29423b;border-radius:15px;padding:14px}.num{font-size:26px;font-weight:900}.label{font-size:12px;color:#91aaa2}.filters{display:grid;grid-template-columns:1fr 120px;gap:8px}input,textarea,button,select{width:100%;margin-top:8px;padding:12px 13px;border-radius:11px;border:1px solid #355149;background:#081512;color:#fff;font-size:15px}button{font-weight:850;cursor:pointer}.primary{background:#dff7ec;color:#081512;border:0}.danger{background:#481d1d}.ghost{background:transparent}.refresh{width:auto;margin:0}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.chip{width:auto;white-space:nowrap;padding:8px 11px;font-size:12px}.chip.active{background:#dff7ec;color:#081512;border:0}.report{border-top:1px solid #29423b;padding:18px 0}.report:first-child{border-top:0}.target{font-size:19px;font-weight:900;word-break:break-word}.meta{font-size:12px;color:#91aaa2;line-height:1.6;margin:4px 0 10px}.story{white-space:pre-wrap;line-height:1.5;color:#d9e7e3}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:900;background:#332d10;color:#f2dc83}.badge.v{background:#123a2a;color:#9ee2bd}.badge.r{background:#411c1c;color:#ffaaaa}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.alert-box{margin-top:12px;padding:12px;border-radius:13px;background:#1b2a20;border:1px solid #3d6049}.alert-on{font-size:11px;color:#9ee2bd;font-weight:900}.alert-title{font-weight:900;margin-top:3px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.toolbar button{width:auto}.count{font-size:12px;color:#91aaa2}.hidden{display:none!important}.error{color:#ffaaa0}.ok{color:#9ee2bd}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 54px}}@media(max-width:420px){.wrap{padding:12px}.actions{grid-template-columns:1fr}.top{align-items:flex-start}.top button{padding:9px}.brand{font-size:22px}}
</style></head><body><div class="wrap">
<div class="brand">BALI SCAMCHECK 🔐</div><div class="sub">Professional Admin Dashboard V5</div>
<section id="login" class="card"><h2>Login Admin</h2><div class="muted">Gunakan akun admin Supabase yang sudah memiliki role <b>admin</b>.</div><input id="email" type="email" autocomplete="username" placeholder="Email admin"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="loginBtn" class="primary" type="button">LOGIN ADMIN</button><p id="loginMsg" class="muted"></p></section>
<section id="app" class="hidden">
<div class="top"><div><h2>Dashboard</h2><div id="who" class="muted"></div></div><button id="logoutBtn" class="ghost" type="button">Logout</button></div>
<div class="grid"><div class="stat"><div id="pendingN" class="num">0</div><div class="label">Pending</div></div><div class="stat"><div id="verifiedN" class="num">0</div><div class="label">Verified</div></div><div class="stat"><div id="rejectedN" class="num">0</div><div class="label">Rejected</div></div><div class="stat"><div id="alertN" class="num">0</div><div class="label">🚨 Active Alert</div></div></div>
<div class="card"><div class="filters"><input id="search" placeholder="Cari nomor, rekening, cerita, alert..."><button id="refreshBtn" class="primary refresh" type="button">↻</button></div><div class="chips" style="margin-top:10px"><button class="chip active" data-filter="all" type="button">Semua</button><button class="chip ghost" data-filter="pending" type="button">Pending</button><button class="chip ghost" data-filter="verified" type="button">Verified</button><button class="chip ghost" data-filter="rejected" type="button">Rejected</button><button class="chip ghost" data-filter="alert" type="button">🚨 Alert</button></div></div>
<div class="toolbar"><div id="resultCount" class="count">0 laporan</div><button id="topRefresh" class="ghost" type="button">Muat ulang</button></div>
<div id="list" class="card"><div class="muted">Memuat...</div></div>
</section></div>
<script>
const SUPABASE_URL="https://mqfipqpmsuapfctotjzo.supabase.co";
const SUPABASE_KEY="sb_publishable_4sFZXYku2HwgJ7wvHWwKLA_tN-nKxk-";
let accessToken="",rows=[],activeFilter="all";
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c]))}
async function auth(path,body){const r=await fetch(SUPABASE_URL+"/auth/v1/"+path,{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw new Error(d.error_description||d.msg||t||"Login gagal");return d}
async function api(path,opt={}){const headers={apikey:SUPABASE_KEY,Authorization:"Bearer "+accessToken,"Content-Type":"application/json",...(opt.headers||{})};const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opt,headers});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{}if(!r.ok)throw new Error((d&&d.message)||t||("HTTP "+r.status));return d}
function showApp(w){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=w||"Admin"}
async function login(){const msg=$("loginMsg");msg.textContent="Memproses...";try{const d=await auth("token?grant_type=password",{email:$("email").value.trim(),password:$("password").value});accessToken=d.access_token;sessionStorage.setItem("bsc_admin_token",accessToken);showApp($("email").value.trim());await loadAll()}catch(e){msg.innerHTML="<span class=error>"+esc(e.message)+"</span>"}}
async function loadAll(){$("list").innerHTML="<div class=muted>Memuat laporan...</div>";try{rows=await api("reports?select=*&order=created_at.desc");$("pendingN").textContent=rows.filter(x=>x.status==="pending").length;$("verifiedN").textContent=rows.filter(x=>x.status==="verified").length;$("rejectedN").textContent=rows.filter(x=>x.status==="rejected").length;$("alertN").textContent=rows.filter(x=>x.is_alert===true&&x.status==="verified").length;render()}catch(e){$("list").innerHTML="<div class=error>Gagal memuat laporan: "+esc(e.message)+"</div>"}}
function setFilter(f){activeFilter=f;document.querySelectorAll("[data-filter]").forEach(b=>b.classList.toggle("active",b.dataset.filter===f));render()}
function render(){const q=$("search").value.trim().toLowerCase();const data=rows.filter(r=>{const s=[r.target,r.target_type,r.category,r.area,r.story,r.alert_title,r.admin_note].map(x=>String(x||"").toLowerCase()).join(" ");return(!q||s.includes(q))&&(activeFilter==="all"||activeFilter===r.status||(activeFilter==="alert"&&r.is_alert===true));});$("resultCount").textContent=data.length+" laporan";if(!data.length){$("list").innerHTML="<div class=muted>Tidak ada laporan yang cocok.</div>";return}$("list").innerHTML=data.map(r=>card(r)).join("")}
function card(r){const status=r.status||"pending";const badge=status==="verified"?"v":status==="rejected"?"r":"";return `<article class=report><div class=target>${esc(r.target)}</div><div class=meta>${esc(r.target_type)} • ${esc(r.category)} • ${esc(r.area)}<br>${new Date(r.created_at).toLocaleString("id-ID")} <span class="badge ${badge}">${esc(status.toUpperCase())}</span></div><div class=story>${esc(r.story)}</div>${r.admin_note?`<div class="note muted"><b>Catatan admin:</b> ${esc(r.admin_note)}</div>`:""}${r.is_alert?`<div class=alert-box><div class=alert-on>🚨 ALERT AKTIF</div><div class=alert-title>${esc(r.alert_title||"Bali Scam Alert")}</div><input id="edit_${r.id}" value="${esc(r.alert_title||"")}" placeholder="Judul alert"><div class=actions><button class=primary type=button onclick="saveAlert(${r.id})">SIMPAN JUDUL</button><button class=ghost type=button onclick="toggleAlert(${r.id},false)">NONAKTIFKAN</button></div></div>`:""}${status==="pending"?`<textarea id="note_${r.id}" placeholder="Catatan admin / alasan keputusan (opsional)"></textarea><div class=actions><button class=primary type=button onclick="setStatus(${r.id},'verified')">✓ VERIFIKASI</button><button class=danger type=button onclick="setStatus(${r.id},'rejected')">✕ TOLAK</button></div>`:""}${status==="verified"&&!r.is_alert?`<input id="newalert_${r.id}" placeholder="Judul alert, contoh: Waspada modus rental motor di Canggu"><button class=primary type=button onclick="toggleAlert(${r.id},true)">🚨 JADIKAN ALERT</button>`:""}</article>`}
async function setStatus(id,status){const note=($("note_"+id)?.value||"").trim();if(!confirm((status==="verified"?"Verifikasi":"Tolak")+" laporan #"+id+"?"))return;try{await api("reports?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status,admin_note:note||null,is_alert:false,alert_title:null})});await loadAll()}catch(e){alert("Gagal mengubah status:\n"+e.message)}}
async function toggleAlert(id,on){const title=($("newalert_"+id)?.value||"").trim();if(on&&!title){alert("Isi judul alert terlebih dahulu.");return}if(!confirm(on?"Tampilkan laporan ini sebagai Bali Scam Alert?":"Nonaktifkan alert ini?"))return;try{await api("reports?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({is_alert:on,alert_title:on?title:null})});await loadAll()}catch(e){alert("Gagal mengubah alert:\n"+e.message)}}
async function saveAlert(id){const title=($("edit_"+id)?.value||"").trim();if(!title){alert("Judul alert tidak boleh kosong.");return}try{await api("reports?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({alert_title:title,is_alert:true})});await loadAll()}catch(e){alert("Gagal menyimpan judul alert:\n"+e.message)}}
function logout(){accessToken="";sessionStorage.removeItem("bsc_admin_token");location.reload()}
async function restore(){const t=sessionStorage.getItem("bsc_admin_token");if(!t)return;accessToken=t;try{const r=await fetch(SUPABASE_URL+"/auth/v1/user",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+t}});if(!r.ok)throw new Error();const u=await r.json();showApp(u.email||"Admin");await loadAll()}catch(e){sessionStorage.removeItem("bsc_admin_token");accessToken=""}}
$("loginBtn").addEventListener("click",login);$("logoutBtn").addEventListener("click",logout);$("refreshBtn").addEventListener("click",loadAll);$("topRefresh").addEventListener("click",loadAll);$("search").addEventListener("input",render);document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>setFilter(b.dataset.filter)));$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});restore();
</script></body></html>
