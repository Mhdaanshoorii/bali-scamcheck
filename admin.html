<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071311">
<title>Bali ScamCheck — Admin V6</title>
<style>
*{box-sizing:border-box}
html{background:#071311}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071311;color:#edf7f3;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit}
button{touch-action:manipulation}
.wrap{max-width:820px;margin:auto;padding:14px 12px calc(28px + env(safe-area-inset-bottom))}
.brand{font-size:23px;font-weight:900;letter-spacing:-.5px}
.sub{color:#9bb0aa;font-size:13px;margin:3px 0 14px}
.card{background:#10201d;border:1px solid #28403a;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 8px 24px #0003}
h2{font-size:20px;margin:0 0 8px}
h3{font-size:16px;margin:0 0 6px}
.muted{color:#9bb0aa}
.hint{font-size:12px;line-height:1.5}
input,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #36514a;background:#0b1816;color:#fff;font-size:16px;outline:none}
input{margin-top:8px}
textarea{min-height:82px;resize:vertical;margin-top:8px}
input:focus,textarea:focus{border-color:#7fbca2;box-shadow:0 0 0 3px #7fbca21c}
button{width:100%;min-height:46px;padding:12px 13px;border-radius:12px;border:1px solid #36514a;background:#0b1816;color:#fff;font-weight:850;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.primary{background:#dff7ec;color:#0a1714;border:0}
.danger{background:#401b1b}
.ghost{background:transparent}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.logout{width:auto;min-height:42px;margin:0;padding:9px 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}
.stat{background:#0b1816;border:1px solid #28403a;border-radius:14px;padding:11px;min-width:0}
.num{font-size:21px;font-weight:900}
.label{font-size:10px;color:#9bb0aa}
.filters{display:grid;grid-template-columns:1fr 48px;gap:8px}
.filters input{min-width:0;margin-top:0}
.refresh{width:48px;margin:0;padding:0}
.chips{display:flex;gap:7px;overflow-x:auto;padding:3px 1px 2px;margin-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{width:auto;min-width:max-content;min-height:40px;margin:0;padding:8px 12px;font-size:12px;white-space:nowrap}
.chip.active{background:#dff7ec;color:#0a1714;border:0}
.report{border-top:1px solid #28403a;padding:15px 0}
.report:first-child{border-top:0}
.target{font-size:18px;font-weight:900;word-break:break-word}
.meta{font-size:12px;color:#9bb0aa;line-height:1.55;margin:5px 0 9px}
.story{white-space:pre-wrap;line-height:1.5;color:#d9e7e3;font-size:14px}
.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:900;background:#332c10;color:#f2dc83}
.badge.v{background:#123b2b;color:#9ee2bd}
.badge.r{background:#401c1c;color:#ffaaaa}
.badge.a{background:#3a2410;color:#ffd68a}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.note{margin-top:9px}
.alert-box{margin-top:10px;padding:11px;border-radius:12px;background:#1b2b20;border:1px solid #3d6049}
.alert-title{font-weight:850}
.alert-on{color:#9ee2bd;font-size:12px;font-weight:800}
.empty{text-align:center;padding:26px 8px}
.hidden{display:none!important}
.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:#0b1816;border:1px solid #28403a;border-radius:13px;padding:11px}
.mini b{display:block;font-size:16px;margin-top:3px;word-break:break-word}
.progress{height:7px;background:#071311;border-radius:99px;overflow:hidden;margin-top:7px}
.progress i{display:block;height:100%;background:#dff7ec}
.toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;background:#dff7ec;color:#0a1714;padding:12px 14px;border-radius:13px;font-weight:800;box-shadow:0 12px 35px #0007;text-align:center}
@media(max-width:520px){
 .stats{grid-template-columns:1fr 1fr}
 .stats .stat:nth-child(4){grid-column:1/-1}
 .card{padding:13px;border-radius:16px}
 .actions{grid-template-columns:1fr}
 .top{align-items:flex-start}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">BALI SCAMCHECK 🔐</div>
  <div class="sub">Admin Dashboard • V6 Professional Mobile</div>

  <section id="login" class="card">
    <h2>Login Admin</h2>
    <div class="muted hint">Gunakan akun admin Supabase.</div>
    <input id="email" type="email" autocomplete="username" placeholder="Email admin">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <button id="loginBtn" class="primary" type="button">LOGIN</button>
    <p id="loginMsg" class="muted hint"></p>
  </section>

  <section id="app" class="hidden">
    <div class="top">
      <div><h2>Dashboard</h2><div id="who" class="muted hint"></div></div>
      <button id="logoutBtn" class="logout ghost" type="button">Logout</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="num" id="pendingN">0</div><div class="label">PENDING</div></div>
      <div class="stat"><div class="num" id="verifiedN">0</div><div class="label">VERIFIED</div></div>
      <div class="stat"><div class="num" id="rejectedN">0</div><div class="label">REJECTED</div></div>
      <div class="stat"><div class="num" id="alertN">0</div><div class="label">ACTIVE ALERT</div></div>
    </div>

    <div class="card">
      <div class="filters">
        <input id="search" autocomplete="off" type="search" placeholder="Cari nomor, kategori, area...">
        <button id="refreshBtn" class="refresh primary" type="button" aria-label="Refresh">↻</button>
      </div>
      <div class="chips">
        <button class="chip active" data-filter="all" type="button">Semua</button>
        <button class="chip ghost" data-filter="pending" type="button">Pending</button>
        <button class="chip ghost" data-filter="verified" type="button">Verified</button>
        <button class="chip ghost" data-filter="rejected" type="button">Rejected</button>
        <button class="chip ghost" data-filter="alert" type="button">🚨 Alert</button>
      </div>
    </div>

    <section class="card">
      <h3>⚡ Quick Insight</h3>
      <div class="insight-grid">
        <div class="mini"><span class="hint">Modus terbanyak</span><b id="topCategory">—</b></div>
        <div class="mini"><span class="hint">Area terbanyak</span><b id="topArea">—</b></div>
      </div>
    </section>

    <div id="list" class="card"><div class="muted">Memuat...</div></div>
  </section>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL="https://mqfipqpmsuapfctotjzo.supabase.co";
const SUPABASE_KEY="sb_publishable_4sFZXYku2HwgJ7wvHWwKLA_tN-nKxk-";
let accessToken="",rows=[],activeFilter="all";

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg){
 const t=$("toast"); t.textContent=msg; t.classList.remove("hidden");
 clearTimeout(window.__toast); window.__toast=setTimeout(()=>t.classList.add("hidden"),1800);
}

async function auth(path,body){
 const r=await fetch(SUPABASE_URL+"/auth/v1/"+path,{
   method:"POST",
   headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},
   body:JSON.stringify(body)
 });
 const t=await r.text(); let d={}; try{d=JSON.parse(t)}catch{}
 if(!r.ok)throw new Error(d.error_description||d.msg||t||"Login gagal");
 return d;
}

async function login(){
 const msg=$("loginMsg"),btn=$("loginBtn");
 msg.textContent="Memproses..."; btn.disabled=true;
 try{
   const d=await auth("token?grant_type=password",{email:$("email").value.trim(),password:$("password").value});
   accessToken=d.access_token;
   sessionStorage.setItem("bsc_admin_token",accessToken);
   showApp($("email").value.trim());
   await loadAll();
   toast("Login berhasil");
 }catch(e){msg.textContent=e.message}
 finally{btn.disabled=false}
}

function showApp(w){
 $("login").classList.add("hidden");
 $("app").classList.remove("hidden");
 $("who").textContent=w||"Admin";
}

async function api(path,opt={}){
 const headers={
   apikey:SUPABASE_KEY,
   Authorization:"Bearer "+accessToken,
   "Content-Type":"application/json",
   ...(opt.headers||{})
 };
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opt,headers});
 const t=await r.text(); let d=null; try{d=t?JSON.parse(t):null}catch{}
 if(!r.ok)throw new Error((d&&d.message)||t||("HTTP "+r.status));
 return d;
}

function topItem(arr){
 const m={};
 arr.forEach(v=>{v=String(v||"").trim();if(v)m[v]=(m[v]||0)+1});
 return Object.entries(m).sort((a,b)=>b[1]-a[1])[0]?.[0]||"—";
}

function updateStats(){
 $("pendingN").textContent=rows.filter(x=>x.status==="pending").length;
 $("verifiedN").textContent=rows.filter(x=>x.status==="verified").length;
 $("rejectedN").textContent=rows.filter(x=>x.status==="rejected").length;
 $("alertN").textContent=rows.filter(x=>x.status==="verified"&&x.is_alert).length;
 $("topCategory").textContent=topItem(rows.filter(x=>x.status==="verified").map(x=>x.category));
 $("topArea").textContent=topItem(rows.filter(x=>x.status==="verified").map(x=>x.area));
}

async function loadAll(){
 $("list").innerHTML="<div class='muted'>Memuat laporan...</div>";
 $("refreshBtn").disabled=true;
 try{
   rows=await api("reports?select=*&order=created_at.desc");
   updateStats(); render();
 }catch(e){
   $("list").innerHTML="<div class='muted'>Gagal memuat: "+esc(e.message)+"</div>";
 }finally{$("refreshBtn").disabled=false}
}

function setFilter(f){
 activeFilter=f;
 document.querySelectorAll("[data-filter]").forEach(b=>b.classList.toggle("active",b.dataset.filter===f));
 render();
}

function render(){
 const q=$("search").value.trim().toLowerCase();
 const data=rows.filter(r=>{
   const blob=[r.target,r.target_type,r.category,r.area,r.story,r.alert_title,r.admin_note].map(x=>String(x||"").toLowerCase()).join(" ");
   const searchOK=!q||blob.includes(q);
   const filterOK=activeFilter==="all"||activeFilter===r.status||(activeFilter==="alert"&&r.is_alert);
   return searchOK&&filterOK;
 });
 if(!data.length){$("list").innerHTML="<div class='muted empty'>Tidak ada laporan.</div>";return}
 $("list").innerHTML=data.map(r=>{
   const pending=r.status==="pending";
   const verified=r.status==="verified";
   return `<article class="report">
     <div class="target">${esc(r.target)}</div>
     <div class="meta">${esc(r.target_type)} • ${esc(r.category)} • ${esc(r.area)}<br>
       ${new Date(r.created_at).toLocaleString("id-ID")}
       <span class="badge ${verified?"v":r.status==="rejected"?"r":""}">${esc(r.status)}</span>
       ${r.is_alert?` <span class="badge a">ALERT</span>`:""}
     </div>
     <div class="story">${esc(r.story)}</div>
     ${r.admin_note?`<div class="note muted hint"><b>Catatan admin:</b> ${esc(r.admin_note)}</div>`:""}
     ${r.is_alert?`
       <div class="alert-box">
         <div class="alert-on">🚨 ALERT AKTIF</div>
         <div class="alert-title">${esc(r.alert_title||"Bali Scam Alert")}</div>
         <input id="edit_alert_${r.id}" value="${esc(r.alert_title||"")}" placeholder="Judul alert">
         <div class="actions">
           <button class="primary" type="button" onclick="updateAlertTitle(${r.id})">SIMPAN JUDUL</button>
           <button class="ghost" type="button" onclick="toggleAlert(${r.id},false)">NONAKTIFKAN</button>
         </div>
       </div>`:""}
     ${pending?`
       <div class="note">
         <textarea id="note_${r.id}" placeholder="Catatan admin / alasan keputusan (opsional)"></textarea>
         <div class="actions">
           <button class="primary" type="button" onclick="setStatus(${r.id},'verified')">✓ VERIFIKASI</button>
           <button class="danger" type="button" onclick="setStatus(${r.id},'rejected')">✕ TOLAK</button>
         </div>
       </div>`:""}
     ${verified&&!r.is_alert?`
       <div class="note">
         <input id="alert_${r.id}" placeholder="Judul alert, contoh: Waspada modus rental motor di Canggu">
         <button class="primary" type="button" onclick="toggleAlert(${r.id},true)">🚨 JADIKAN ALERT</button>
       </div>`:""}
   </article>`;
 }).join("");
}

async function setStatus(id,status){
 const note=(($("note_"+id)||{}).value||"").trim();
 const word=status==="verified"?"verifikasi":"menolak";
 if(!confirm("Yakin ingin "+word+" laporan #"+id+"?"))return;
 try{
   await api("reports?id=eq."+id,{
     method:"PATCH",
     headers:{Prefer:"return=minimal"},
     body:JSON.stringify({status,admin_note:note||null})
   });
   await loadAll(); toast(status==="verified"?"Laporan diverifikasi":"Laporan ditolak");
 }catch(e){alert("Gagal mengubah status:\n"+e.message)}
}

async function toggleAlert(id,on){
 const title=(($("alert_"+id)||{}).value||"").trim();
 if(on&&!title){alert("Isi judul alert terlebih dahulu.");return}
 if(on&&!confirm("Tampilkan laporan ini sebagai Bali Scam Alert?"))return;
 if(!on&&!confirm("Nonaktifkan alert ini?"))return;
 try{
   await api("reports?id=eq."+id,{
     method:"PATCH",
     headers:{Prefer:"return=minimal"},
     body:JSON.stringify({is_alert:on,alert_title:on?title:null})
   });
   await loadAll(); toast(on?"Alert diaktifkan":"Alert dinonaktifkan");
 }catch(e){alert("Gagal mengubah alert:\n"+e.message)}
}

async function updateAlertTitle(id){
 const title=(($("edit_alert_"+id)||{}).value||"").trim();
 if(!title){alert("Judul alert tidak boleh kosong.");return}
 try{
   await api("reports?id=eq."+id,{
     method:"PATCH",
     headers:{Prefer:"return=minimal"},
     body:JSON.stringify({alert_title:title,is_alert:true})
   });
   await loadAll(); toast("Judul alert diperbarui");
 }catch(e){alert("Gagal menyimpan judul alert:\n"+e.message)}
}

function logout(){
 accessToken=""; sessionStorage.removeItem("bsc_admin_token"); location.reload();
}

async function restore(){
 const t=sessionStorage.getItem("bsc_admin_token"); if(!t)return;
 accessToken=t;
 try{
   const r=await fetch(SUPABASE_URL+"/auth/v1/user",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+t}});
   if(!r.ok)throw 0;
   const u=await r.json(); showApp(u.email||"Admin"); await loadAll();
 }catch{sessionStorage.removeItem("bsc_admin_token")}
}

document.addEventListener("DOMContentLoaded",()=>{
 $("loginBtn").addEventListener("click",login);
 $("logoutBtn").addEventListener("click",logout);
 $("refreshBtn").addEventListener("click",loadAll);
 $("search").addEventListener("input",render);
 $("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
 document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>setFilter(b.dataset.filter)));
 restore();
});
</script>
</body>
</html>
